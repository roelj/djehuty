<script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Dataset"
        {%- if item.title %}
        ,"name": {{ item.title | tojson }}
        {%- endif %}
        {%- if doi %}
        ,"identifier": {{ ("https://doi.org/" ~ doi) | tojson }}
        {%- endif %}
        {%- if citation %}
        ,"citation": {{ citation | tojson }}
        {%- endif %}
        {%- if item.version is defined and item.version is not none %}
        ,"version": {{ item.version | tojson }}
        {%- endif %}
        {%- if item.description %}
        ,"description": {{ item.description | tojson }}
        {%- endif %}
        {%- if item.publisher %}
        ,"publisher": {
            "@type": "Organization",
            "name": {{ item.publisher | tojson }}
        }
        {%- endif %}
        {%- if item.license_url %}
        ,"license": {{ item.license_url | tojson }}
        {%- endif %}
        {%- if tags %}
        ,"keywords": {{ tags | sort | tojson }}
        {%- endif %}
        {%- if authors %}
        ,"creator": [
        {%- for a in authors %}
        {
            "@type": "Person"
            {%- if a.full_name %}
            ,"name": {{ a.full_name | tojson }}
            {%- endif %}
            {%- if a.orcid_id %}
            ,"sameAs": {{ ("https://orcid.org/" ~ a.orcid_id) | tojson }}
            {%- endif %}
          }{%- if not loop.last %},{%- endif %}
        {%- endfor %}
        ]
        {%- endif %}
        {%- if coordinates.lat and coordinates.lon %}
            ,"spatialCoverage": {
                "@type": "Place",
                "geo": {
                    "@type": "GeoCoordinates",
                    "latitude":  {{ coordinates.lat | tojson }},
                    "longitude": {{ coordinates.lon | tojson }}
                }
            }
        {%- elif item.geolocation %}
            ,"spatialCoverage": {{ item.geolocation | tojson }}
        {%- endif %}
        {%- if item.time_coverage %}
            ,"temporalCoverage": {{ item.time_coverage | tojson }}
        {%- endif %}
        {%- set valid_fundings = fundings | default([], True) | selectattr('funder_name') | list %}
        {%- if valid_fundings %}
            ,"funder": [
            {%- for funding in valid_fundings  %}
                {
                    "@type": "Organization",
                    "name": {{ funding.funder_name | tojson }}
                }{%- if not loop.last %},{%- endif %}
            {%- endfor %}
            ]
        {%- endif %}

        {%- if collections %}
            ,"includedInDataCatalog": [
            {%- for c in collections %}
                {
                    "@type": "DataCatalog"
                    {%- if c.title %}
                    ,"name": {{ c.title | tojson }}
                    {%- endif %}
                    ,"url": {{ (base_url ~ "/collections/" ~ c.container_uuid) | tojson }}
                }{%- if not loop.last %},{%- endif %}
            {%- endfor %}
            ]
        {%- endif %}
        {%- if not item.is_embargoed and  not item.is_restricted  and not item.is_metadata_record %}
            ,"isAccessibleForFree" : true,
            "distribution": {
                "@type": "DataDownload",
                "contentUrl": {{ (base_url ~ "/ndownloader/items/" ~ item.container_uuid ~ "/versions/" ~ (item.version | default('draft', True))) | tojson }},
                "encodingFormat": "application/zip"
            }
        {%- endif %}
    }
    </script>
