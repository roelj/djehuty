<script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Dataset",
        "name": {{ item.title | tojson }},
        "identifier": {{ ("https://doi.org/" ~ doi) | tojson }},
        "citation": {{ citation | tojson }},
        "version": {{ item.version | tojson }},
        "description": {{ item.description | tojson }},
        "publisher": {
            "@type": "Organization",
            "name": {{ item.publisher | tojson }}
        },
        "license": {{ item.license_url | tojson }},
        "keywords": {{ tags|sort | tojson }},
        "creator": [
        {%- for a in authors %}
        {
            "@type": "Person",
            "name": {{ a.full_name | tojson }},
            "sameAs": {{ ("https://orcid.org/" ~ a.orcid_id) | tojson }}
          }{%- if not loop.last %},{%- endif %}
        {%- endfor %}
        ]

        {%- if coordinates.lat and coordinates.lon %}
            ,"spatialCoverage": {
                "@type": "Place",
                "geo": {
                    "@type": "GeoCoordinates",
                    "latitude":  {{ coordinates.lat | tojson }},
                    "longitude": {{ coordinates.lon | tojson }}
                }
            }
        {%- elif item.geolocation %}
            ,"spatialCoverage": {{ item.geolocation | tojson }}
        {%- endif %}
        {%- if item.time_coverage %}
            ,"temporalCoverage": {{ item.time_coverage | tojson }}
        {%- endif %}
        {%- set valid_fundings = fundings | selectattr('funder_name') | list %}
        {%- if valid_fundings %}
            ,"funder": [
            {%- for funding in valid_fundings  %}
                {
                    "@type": "Organization",
                    "name": {{ funding.funder_name | tojson }}
                }{%- if not loop.last %},{%- endif %}
            {%- endfor %}
            ]
        {%- endif %}

        {%- if collections %}
            ,"includedInDataCatalog": [
            {%- for c in collections %}
                {
                    "@type": "DataCatalog",
                    "name": {{ c.title | tojson }},
                    "url": {{ (base_url ~ "/collections/" ~ c.container_uuid) | tojson }}
                }{%- if not loop.last %},{%- endif %}
            {%- endfor %}
            ]
        {%- endif %}
        {%- if not item.is_embargoed and  not item.is_restricted  and not item.is_metadata_record %}
            ,"isAccessibleForFree" : true,
            "distribution": {
                "@type": "DataDownload",
                "contentUrl": {{ (base_url ~ "/ndownloader/items/" ~ item.container_uuid ~ "/versions/" ~ (item.version | default('draft', False))) | tojson }},
                "encodingFormat": "application/zip"
            }
        {%- endif %}
    }
    </script>
